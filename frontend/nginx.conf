server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # History fallback serves the static entry for deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
